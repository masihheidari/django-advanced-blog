services:
  backend:
    build: .
    container_name: django-backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./core:/app
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=dev-secret-key-change-later
      - DEBUG=True
      - ALLOWED_HOSTS=localhost,127.0.0.1