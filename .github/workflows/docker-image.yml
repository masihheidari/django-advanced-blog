name: Django Project Test
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Docker-Compose
      run: docker compose build --no-cache && docker compose up -d

    - name: Debug
      run: docker compose exec -T backend pip show flake8

    - name: Run Tests
      run: docker compose exec -T backend sh -c "flake8 && pytest ."
