name: Django Project Test
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Create .env file
      run: |
        cat <<EOF > .env
        SECRET_KEY=ci-test-secret-key
        DEBUG=True
        ALLOWED_HOSTS=localhost,127.0.0.1
        POSTGRES_DB=test_db
        POSTGRES_USER=test_user
        POSTGRES_PASSWORD=test_password
        POSTGRES_HOST=db
        POSTGRES_PORT=5432
        EOF

    - name: Setup Docker-Compose
      run: docker compose build --no-cache && docker compose up -d

    - name: Show pip list inside container
      run: docker compose exec -T backend pip list

    - name: Run Tests
      run: docker compose exec -T backend sh -c "flake8 ."
